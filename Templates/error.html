{% extends "base.html" %}
{% set layout = 'bare' %}

{% block title %}{{ title }} · Postfy{% endblock %}

{% block content %}
<section class="error-page">
    <div>
        <div class="error-page__code gradient-text">{{ code }}</div>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <div class="row">
            <a href="{{ url_for('newposts') if current_user else url_for('home') }}" class="btn btn--primary">{{ ui.icon('home', 'icon--sm') }} Take me home</a>
            <button type="button" class="btn btn--outline" data-back-button>{{ ui.icon('arrow-left', 'icon--sm') }} Go back</button>
        </div>
    </div>
</section>
{% endblock %}
