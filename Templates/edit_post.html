{% extends "base.html" %}
{% set active_nav = 'newposts' %}

{% block title %}Edit post · Postfy{% endblock %}

{% block content %}
<div class="page-head">
    <a href="{{ url_for('post_detail', post_id=post.id) }}" class="icon-btn" data-back aria-label="Back">{{ ui.icon('arrow-left') }}</a>
    <div>
        <h1 class="page-head__title">Edit post</h1>
        <p class="page-head__sub">Changes are marked as “Edited” on your post</p>
    </div>
</div>

<form method="POST" action="{{ url_for('edit_post', post_id=post.id) }}" enctype="multipart/form-data" class="card card--pad" data-composer>
    {{ ui.csrf() }}
    <div class="field">
        <label class="field__label" for="post_title">Title</label>
        <input type="text" id="post_title" name="post_title" class="input" value="{{ form.title }}" maxlength="{{ MAX_TITLE_LENGTH }}" required dir="auto">
    </div>
    <div class="field">
        <label class="field__label" for="post_content">Content <span class="faint" data-char-label></span></label>
        <textarea id="post_content" name="post_content" rows="8" class="textarea" maxlength="{{ MAX_POST_LENGTH }}" required dir="auto" data-autogrow data-mentions data-counter>{{ form.content }}</textarea>
    </div>

    <div class="field">
        <span class="field__label">Photo</span>
        <div class="composer__preview" data-image-preview {% if not post.image %}hidden{% endif %} style="margin:0">
            <img src="{{ post.image_url or '' }}" alt="Post image preview">
            <button type="button" class="icon-btn icon-btn--sm" data-remove-image aria-label="Remove image">{{ ui.icon('x') }}</button>
        </div>
        <input type="hidden" name="remove_image" value="" data-remove-flag>
        <label class="dropzone" data-dropzone>
            <span class="dropzone__preview" style="border-radius:12px">{{ ui.icon('image') }}</span>
            <span class="dropzone__text"><strong>{{ 'Replace photo' if post.image else 'Add a photo' }}</strong><span>Click or drop an image · PNG, JPG, GIF, WEBP</span></span>
            <input type="file" name="post_image" accept="image/png,image/jpeg,image/gif,image/webp" hidden data-image-input>
        </label>
    </div>

    <div class="settings-card__foot">
        <a href="{{ url_for('post_detail', post_id=post.id) }}" class="btn btn--ghost">Cancel</a>
        <button type="submit" class="btn btn--primary" data-submit>{{ ui.icon('check', 'icon--sm') }} Save changes</button>
    </div>
</form>
{% endblock %}
